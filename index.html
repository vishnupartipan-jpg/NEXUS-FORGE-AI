$('#bFn').onclick=()=>{const f=$('#fi').value,v=ta.value;if(!f)return;let i=v.indexOf(f,ta.selectionEnd);if(i<0)i=v.indexOf(f);if(i<0)return log('Not found: '+f);ta.focus();ta.setSelectionRange(i,i+f.length)};
$('#bRa').onclick=()=>{const f=$('#fi').value;if(!f||!cur)return;ta.focus();ta.select();document.execCommand('insertText',false,ta.value.split(f).join($('#fr').value))};
$('#bRun').onclick=()=>{const h=Object.keys(P.files).find(k=>/(^|\/)index\.html$/.test(k))||Object.keys(P.files).find(k=>/\.html$/.test(k));if(!h)return alert('No HTML file to run. Other project types need their own toolchain (see README).');if(!confirm('Run '+h+' in an isolated preview? This executes the project code.'))return;if(cur)B[cur]=ta.value;const d=h.replace(/[^/]*$/,''),g=u=>cont(d+u);const s=cont(h).replace(/<link[^>]+href=["']([^"']+)["'][^>]*>/g,(m,u)=>g(u)!=null?'<style>'+g(u)+'</style>':m).replace(/<script([^>]*?)src=["']([^"']+)["']([^>]*)><\/script>/g,(m,a,u)=>g(u)!=null?'<script>'+g(u)+'<\/script>':m);modal(`<h3>Preview: ${esc(h)}</h3><iframe sandbox="allow-scripts allow-forms allow-modals" style="width:100%;height:60vh;border:1px solid var(--b)"></iframe><p><button id=mc>Close</button></p>`);$('#mb iframe').srcdoc=s;$('#mc').onclick=unmodal;log('Ran '+h)};
$('#tc').onkeydown=e=>{if(e.key!='Enter')return;const c=e.target.value.trim(),[x,...a]=c.split(/\s+/),o=$('#tl');e.target.value='';let r='';if(x=='ls')r=Object.keys(P.files).sort().join('\n');else if(x=='cat')r=cont(a[0])??'No such file';else if(x=='clear'){o.textContent='';return}else if(x=='run')return $('#bRun').click();else r='Commands: ls, cat <path>, run, clear. This build has no shell, so project commands are never executed.';o.textContent+='$ '+c+'\n'+r+'\n';o.scrollTop=1e9};
$('#pn').onchange=e=>{const n=e.target.value.trim();if(!n||DB.p[n])return render();delete DB.p[P.name];P.name=n;DB.p[n]=P;DB.cur=n;persist();render()};
$('#bNew').onclick=()=>{const n=prompt('Project name','my-project');if(!n)return;if(DB.p[n])return alert('A project with that name exists.');load(n,mk(n,{'README.md':'# '+n+'\n'}))};
function load(n,np){if(Object.keys(B).some(dirty)&&!confirm('Discard unsaved edits in the open project?'))return;if(np)DB.p[n]=np;DB.cur=n;P=DB.p[n];T=[];B={};cur='';sel='';open=new Set();Object.keys(P.files).forEach(k=>ex(k+'x'));persist();openFile(P.files['README.md']!==undefined?'README.md':'');chatR();hist()}
function hist(){const q=$('#hs').value.toLowerCase();NS=Object.keys(DB.p);$('#hl').innerHTML='<h4>Projects</h4>'+NS.map((n,i)=>[n,i]).filter(([n])=>n.toLowerCase().includes(q)).map(([n,i])=>{const p=DB.p[n];return`<div class="hi ${p===P?'sel':''}"><b>${esc(n)}</b><br><small>Created ${new Date(p.t0).toLocaleDateString()}, ${Object.keys(p.files).length} items, ${p.up.length} uploads</small><br><button data-h=o data-i=${i}>Open</button> <button data-h=r data-i=${i}>Rename</button> <button data-h=d data-i=${i}>Delete</button></div>`}).join('')+'<h4>Earlier chats in this project</h4>'+(P.chats.map((c,i)=>[c,i]).filter(([c])=>c.n.toLowerCase().includes(q)).map(([c,i])=>`<div class=hi><b>${esc(c.n)}</b><br><small>${new Date(c.t).toLocaleString()}</small><br><button data-h=c data-i=${i}>Open chat</button> <button data-h=x data-i=${i}>Delete</button></div>`).join('')||'<small>None yet.</small>')}
$('#hs').oninput=hist;
$('#hl').onclick=e=>{const b=e.target.closest('button');if(!b)return;const h=b.dataset.h,i=+b.dataset.i,n=NS[i];if(h=='o')return load(n);if(h=='r'){const x=prompt('Rename to',n);if(x&&x!=n&&!DB.p[x]){const p=DB.p[n];delete DB.p[n];p.name=x;DB.p[x]=p;if(DB.cur==n)DB.cur=x}}else if(h=='d'){if(!confirm(`Delete project "${n}" and its history? This cannot be undone.`))return;delete DB.p[n];if(!Object.keys(DB.p).length)DB.p['my-project']=mk('my-project',{'README.md':'# my-project\n'});if(DB.cur==n){const k=Object.keys(DB.p)[0];B={};load(k)}}else if(h=='c'){P.chat=P.chats[i].m;chatR();go('rc')}else if(h=='x'){if(!confirm('Delete this chat?'))return;P.chats.splice(i,1)}persist();$('#pn').value=P.name;hist()};
async function ping(){try{M=(await window.nf.tags(S.url)).models.map(m=>m.name)}catch{M=[]}if(!M.includes(S.model))S.model=M[0]||'';$('#ms').innerHTML=M.map(m=>`<option ${m==S.model?'selected':''}>${esc(m)}</option>`).join('');$('#ms').hidden=!M.length;$('#dt').className=M.length?'ok':'';$('#sm').textContent=M.length?'Local AI connected':'Local AI offline';$('#ml').innerHTML=M.length?M.map(m=>`<div><button data-m="${esc(m)}" class="${m==S.model?'on':''}">${esc(m)}</button></div>`).join(''):'<p>No local model found.</p><button id=bS2>Show setup steps</button>'}
$('#ou').value=S.url;$('#ou').onchange=e=>{S.url=e.target.value.trim().replace(/\/$/,'');persist();ping()};$('#bPing').onclick=ping;
$('#ms').onchange=e=>{S.model=e.target.value;persist();ping()};$('#ml').onclick=e=>{if(e.target.dataset.m){S.model=e.target.dataset.m;persist();ping()}else if(e.target.id=='bS2')setup()};
function setup(){modal(`<h3>Local AI model needed</h3><p>No local model answered at <b>${esc(S.url)}</b>, so nothing was generated.</p><ol><li>Install Ollama from ollama.com (internet is needed once).</li><li>Run <code>ollama pull qwen2.5-coder</code> or any other code model.</li><li>Keep Ollama running with <code>ollama serve</code>.</li><li>If the dot stays empty, start Ollama with <code>OLLAMA_ORIGINS=*</code> so this page may connect.</li></ol><button class=pri id=mk>Check again</button> <button id=mc>Close</button>`);$('#mc').onclick=unmodal;$('#mk').onclick=async()=>{await ping();if(M.length)unmodal()}}
const need=()=>{if(S.model)return 1;setup();return 0};
async function ai(msgs,on){const id=crypto.randomUUID();ctl.signal.addEventListener('abort',()=>window.nf.abort(id));let out='';return new Promise((res,rej)=>window.nf.chat(id,S.url,S.model,msgs,t=>{out+=t;on(out)},err=>err==='aborted'?rej(Object.assign(Error('aborted'),{name:'AbortError'})):err?rej(Error(err)):res(out)))}
async function run(msgs,on){ctl=new AbortController();$('#bStop').hidden=$('#ld').hidden=false;$('#bStop').hidden=false;$('#ld').hidden=false;try{return await ai(msgs,t=>{$('#ld').textContent='Model is writing… '+t.length+' characters';on&&on(t)})}catch(e){if(e.name!='AbortError'){log('AI error: '+e.message);alert('The local model request failed: '+e.message+'\nCheck that Ollama is running (Local AI Models tab).')}return null}finally{$('#bStop').hidden=$('#ld').hidden=true}}
$('#bStop').onclick=()=>ctl&&ctl.abort();
const code=r=>(r.match(/```[^\n]*\n([\s\S]*?)\n```/)||[])[1];
const files=()=>Object.keys(P.files).filter(k=>!k.endsWith('/')).slice(0,60).join(', ');
function review(f,title){pend=f;const rows=Object.entries(f).map(([p,n])=>{const o=P.files[p]===undefined?null:cont(p),os=new Set((o||'').split('\n')),ns=new Set(n.split('\n')),d=o==null?n.split('\n').map(l=>'+ '+l):[...o.split('\n').filter(l=>!ns.has(l)).map(l=>'- '+l),...n.split('\n').filter(l=>!os.has(l)).map(l=>'+ '+l)];return`<h4>${esc(p)} <small>${o==null?'new file':'modified'}</small></h4><div class=df>${d.slice(0,200).map(l=>`<div class="${l[0]=='+'?'ad':'rm'}">${esc(l)}</div>`).join('')||'No line changes'}${d.length>200?'<div>… '+(d.length-200)+' more lines</div>':''}</div>`}).join('');modal(`<h3>${esc(title)}: review before applying</h3>${rows}<p><button class=pri id=ap>Apply Changes</button> <button id=rj>Reject Changes</button></p><small>Applying keeps the previous text under Restore Version.</small>`);$('#ap').onclick=apply;$('#rj').onclick=()=>{unmodal();log('Changes rejected')}}
function apply(){const ks=Object.keys(pend);if(cur)B[cur]=ta.value;for(const[p,n]of Object.entries(pend)){if(P.files[p]!==undefined)ver(p,cont(p));P.files[p]=n;if(B[p]!==undefined)B[p]=n;ex(p)}unmodal();persist();log('Applied changes to '+ks.join(', '));if(ks.includes(cur)||!cur)openFile(ks.includes(cur)?cur:ks[0]);else render()}
$('#bGen').onclick=async()=>{const q=$('#gp').value.trim();if(!q)return alert('Describe what to build first.');if(!need())return;log('Generating with '+S.model);const r=await run([{role:'system',content:'You generate complete, working source code. Reply ONLY with files in this exact format and nothing else:\n=== FILE: relative/path.ext ===\n```\nfull file content\n```\nUse real code, never placeholders. Always include README.md. Existing files: '+files()},{role:'user',content:q}]);if(r==null)return;const f={};for(const m of r.matchAll(/=== FILE:\s*(.+?)\s*===\s*\n```[^\n]*\n([\s\S]*?)\n```/g)){const p=m[1].replace(/^\.?\//,'');if(okp(p)&&!p.endsWith('/'))f[p]=m[2]}if(!Object.keys(f).length){log('Reply was not in file format:\n'+r.slice(0,1500));return alert('The model did not return files in the expected format. Its raw reply is in Output. Try again or use a larger code model.')}review(f,'Generated files')};
$('#bRg').onclick=async()=>{if(!cur)return alert('Open or select a file first.');if(!need())return;const r=await run([{role:'system',content:'Rewrite one file completely. Reply ONLY with one fenced code block holding the full new content of '+cur+'. Project files: '+files()},{role:'user',content:($('#gp').value||'Write this file completely, following its path and purpose.')+'\n\nCurrent content:\n```\n'+ta.value+'\n```'}]);if(r==null)return;const c=code(r);if(c==null){log(r.slice(0,1500));return alert('No code block in the reply. Raw reply is in Output.')}review({[cur]:c},'Regenerated '+cur)};
$('#ea').innerHTML=Object.keys(AC).map(k=>`<option>${k}</option>`).join('');
$('#bAi').onclick=async()=>{if(!cur)return alert('Open a file first.');if(!need())return;const s=ta.selectionStart,e=ta.selectionEnd,all=s==e,v=ta.value,a=$('#ea').value,txt=/^(Explain|Debug)$/.test(a);const r=await run([{role:'system',content:'You are a code assistant inside an IDE. File: '+cur+'. '+(txt?'Answer in prose.':'Reply with ONLY the full replacement code in one fenced code block, no commentary.')},{role:'user',content:AC[a]+'. '+$('#ei').value+'\n\n```\n'+(all?v:v.slice(s,e))+'\n```'}]);if(r==null)return;if(txt){P.chat.push({r:'user',c:a+': '+cur},{r:'assistant',c:r});persist();chatR();return go('rc')}const c=code(r);if(c==null){log(r.slice(0,1500));return alert('No code block in the reply. Raw reply is in Output.')}review({[cur]:all?c:v.slice(0,s)+c+v.slice(e)},a)};
$('#bRest').onclick=()=>{const v=(P.ver[cur]||[])[$('#vs').value];if(!v)return alert('This file has no saved versions yet.');if(!confirm('Replace the current text with this version? The current text is kept as a version.'))return;ver(cur,cont(cur));P.files[cur]=B[cur]=v.c;ta.value=v.c;persist();log('Restored a version of '+cur);render()};
function chatR(){CB=[];$('#cm').innerHTML=P.chat.map(m=>`<div class="m ${m.r}">`+m.c.split('```').map((x,i)=>{if(i%2==0)return esc(x).replace(/\n/g,'<br>');const c=x.replace(/^[^\n]*\n/,'');CB.push(c);return`<div class=cb><pre>${esc(c)}</pre><button data-k=cp data-i=${CB.length-1}>Copy Code</button> <button data-k=in data-i=${CB.length-1}>Insert Into Editor</button></div>`}).join('')+'</div>').join('')||'<small>Ask about your project. The active file is always shared with the model, and nothing leaves your computer.</small>';$('#cm').scrollTop=1e9}
$('#cm').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const c=CB[+b.dataset.i];if(b.dataset.k=='cp'){try{await navigator.clipboard.writeText(c);b.textContent='Copied'}catch{alert('Copy failed. Select the text and copy it manually.')}}else{if(!cur)return alert('Open a file first.');ta.focus();document.execCommand('insertText',false,c)}};
$('#bSend').onclick=async()=>{const q=$('#ci').value.trim();if(!q)return;if(!need())return;$('#ci').value='';if(cur)B[cur]=ta.value;P.chat.push({r:'user',c:q});const a={r:'assistant',c:''};P.chat.push(a);chatR();const ctx='Project: '+P.name+'\nFiles: '+files()+(cur?'\nActive file '+cur+':\n'+cont(cur).slice(0,8000):'')+(att?'\n\nOther files:\n'+Object.entries(P.files).filter(([k])=>k!=cur&&!k.endsWith('/')).map(([k,v])=>'--- '+k+'\n'+v.slice(0,1500)).join('\n').slice(0,16000):'');const r=await run([{role:'system',content:'You are a coding assistant in an offline IDE. Put code in fenced blocks.\n'+ctx},...P.chat.slice(0,-1).slice(-10).map(m=>({role:m.r,content:m.c}))],t=>{a.c=t;chatR()});if(r!=null)a.c=r;else a.c=a.c||'(stopped)';chatR();persist()};
$('#bAtt').onclick=e=>{att=!att;e.target.classList.toggle('on',!!att)};
$('#bNc').onclick=()=>{if(P.chat.length)P.chats.push({t:Date.now(),n:P.chat[0].c.slice(0,40),m:P.chat});P.chat=[];persist();chatR()};
$('#bCl').onclick=()=>{if(P.chat.length&&confirm('Clear this chat?')){P.chat=[];persist();chatR()}};
document.onkeydown=e=>{if(e.key=='Escape')unmodal()};
onbeforeunload=e=>{if(Object.keys(B).some(dirty))e.preventDefault()};
openFile('README.md');chatR();ping();setInterval(ping,20000);
</script></body></html>
